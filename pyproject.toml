[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "catalog-extensions"
version = "0.1.0"
description = "Open edX Discovery catalog extensions for accreditation, catalog APIs, transcripts, and waitlist metadata"
requires-python = ">=3.11"
dependencies = [
  "bleach",
  "djangorestframework"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
