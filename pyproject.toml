[project]
name = "catalog-extensions"
version = "0.1.0"
description = "Sidecar catalog API extensions for Open edX Discovery"
requires-python = ">=3.11"
dependencies = [
    "djangorestframework",
    "requests",
]

[tool.setuptools.packages.find]
include = ["catalog_extensions*"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
